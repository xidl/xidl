<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>xidl → xidlc</title>
<style>
  :root {
    --bg: #eef0f3;
    --card: #ffffff;
    --ink: #15171b;
    --mute: #737883;
    --line: #d8dbe0;
    --rust: #c8452b;
    --ok: #17a058;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); font-family: "Geist", system-ui, sans-serif; color: var(--ink); }
  body { padding: 12px; }
  .wrap { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 14px; background: var(--bg); border: 1px solid var(--line); }
  .stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; }
  .controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 10px; font-size: 13px; color: var(--mute); }
  .controls button { font: inherit; font-weight: 500; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  .controls button:hover { border-color: var(--ink); }

  .abs { position: absolute; }
  .scene { position: absolute; inset: 0; transition: opacity .7s ease, transform .7s ease, filter .7s ease; }
  .scene.out { opacity: 0; transform: scale(.94); filter: blur(4px); }
  .fade { opacity: 0; transform: translateY(10px); transition: opacity .5s ease, transform .5s ease; }
  .fade.on { opacity: 1; transform: none; }

  .win { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 0 rgba(21,23,27,.04), 0 12px 32px -16px rgba(21,23,27,.18); overflow: hidden; }
  .bar { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; border-bottom: 1px solid var(--line); font-family: "Geist Mono", monospace; font-size: 12.5px; color: var(--mute); }
  .bar .file { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .bar .file i { width: 8px; height: 8px; border-radius: 2px; background: var(--ink); display: inline-block; }
  .tag { font-family: "Geist", sans-serif; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 5px; border: 1px solid var(--line); color: var(--ink); }
  .tag.rust { color: var(--rust); border-color: color-mix(in srgb, var(--rust) 35%, transparent); background: color-mix(in srgb, var(--rust) 7%, transparent); }

  .code { font-family: "Geist Mono", monospace; font-size: 12.5px; line-height: 20px; padding: 12px 0; white-space: pre; }
  .row { display: flex; min-height: 20px; }
  .ln { width: 40px; flex: none; text-align: right; padding-right: 14px; color: var(--line); user-select: none; }
  .caret { display: inline-block; width: 7px; height: 15px; margin-top: 3px; background: var(--ink); animation: blink 1s steps(1) infinite; }
  .caret.rust { background: var(--rust); }
  @keyframes blink { 50% { opacity: 0; } }
  .k { color: var(--rust); }
  .t { font-weight: 600; }
  .s { color: var(--ok); }
  .c, .a { color: var(--mute); }

  .foot { position: absolute; left: 0; right: 0; bottom: 0; height: 34px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 12px; color: var(--mute); background: var(--card); }
  .foot .st { display: flex; align-items: center; gap: 6px; }
  .foot .st.done { color: var(--ok); font-weight: 600; }
  .prog { position: absolute; left: 0; bottom: 34px; height: 2px; width: 0; background: var(--ink); transition: width .1s linear; }
  .prog.rust { background: var(--rust); }

  .compiler { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--ink); color: var(--card); border-radius: 14px; }
  .compiler b { font-family: "Geist Mono", monospace; font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
  .compiler span { font-size: 12px; opacity: .65; }
  .ring { position: absolute; inset: -8px; border-radius: 20px; border: 2px solid transparent; transition: border-color .3s; }
  .compiler.busy .ring { border-color: var(--rust); animation: pulse 1.1s ease-in-out infinite; }
  .compiler.ok .ring { border-color: var(--ok); animation: none; }
  @keyframes pulse { 50% { inset: -13px; opacity: .35; } }

  svg.wires { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  svg.wires path { fill: none; stroke: var(--mute); stroke-width: 2; stroke-linecap: round; }
  svg.wires path.rustw { stroke: var(--rust); }
  svg.wires circle { fill: var(--ink); }
  svg.wires circle.rustw { fill: var(--rust); }

  .caption { position: absolute; left: 30px; bottom: 26px; font-size: 14px; color: var(--mute); display: flex; gap: 10px; align-items: center; }
  .caption b { color: var(--ink); font-weight: 600; }

  /* browser */
  .browser { left: 240px; top: 70px; width: 800px; height: 560px; opacity: 0; transform: translateY(30px) scale(.93); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
  .browser.on { opacity: 1; transform: none; }
  .chrome { height: 44px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); }
  .dots { display: flex; gap: 6px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: block; }
  .url { flex: 1; max-width: 360px; margin: 0 auto; height: 26px; border-radius: 7px; background: var(--bg); font-family: "Geist Mono", monospace; font-size: 12px; color: var(--mute); display: flex; align-items: center; justify-content: center; }
  .page { position: relative; height: calc(100% - 44px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .page h2 { font-size: 26px; font-weight: 600; letter-spacing: -.02em; text-align: center; }
  .page p.sub { font-size: 14px; color: var(--mute); text-align: center; margin-top: 6px; line-height: 1.5; }
  .field { width: 340px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--mute); }
  .input { height: 44px; border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; color: var(--ink); }
  .btnwrap { height: 64px; display: flex; align-items: center; justify-content: center; }
  .btn { position: relative; width: 340px; height: 48px; border-radius: 10px; border: none; background: var(--ink); color: var(--card); font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; transition: width .45s cubic-bezier(.6,0,.2,1), height .45s, border-radius .45s, background-color .35s, transform .15s; }
  .btn .label { transition: opacity .2s; }
  .btn.press { transform: scale(.97); }
  .btn.loading { width: 48px; border-radius: 24px; }
  .btn.loading .label { opacity: 0; }
  .btn.loading::after { content: ""; position: absolute; width: 20px; height: 20px; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--card) 30%, transparent); border-top-color: var(--card); animation: spin .7s linear infinite; }
  .btn.done { width: 64px; height: 64px; border-radius: 32px; background: var(--ok); }
  .btn.done::after { display: none; }
  .btn svg { position: absolute; width: 30px; height: 30px; }
  .btn svg path { fill: none; stroke: var(--card); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; }
  .btn.done svg path { transition: stroke-dashoffset .45s .25s ease-out; stroke-dashoffset: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .resp { height: 22px; font-family: "Geist Mono", monospace; font-size: 13px; color: var(--mute); opacity: 0; transition: opacity .4s; display: flex; align-items: center; gap: 8px; }
  .resp.on { opacity: 1; }
  .resp .okc { color: var(--ok); font-weight: 600; }
  .cursor { position: absolute; left: 0; top: 0; width: 22px; height: 22px; z-index: 5; opacity: 0; transition: transform 1s cubic-bezier(.45,.05,.25,1), opacity .3s; pointer-events: none; }
  .cursor svg { width: 22px; height: 22px; transition: transform .12s; transform-origin: 3px 3px; }
  .cursor.press svg { transform: scale(.82); }
  .cursor path { fill: var(--ink); stroke: var(--card); stroke-width: 1.4; }
</style>
</head>
<body>
  <div class="wrap" id="wrap"><div class="stage" id="stage"></div></div>
  <div class="controls"><span id="hint">Auto looping · ready for screen recording</span><button id="replay" type="button">Replay</button></div>

<template id="tpl">
  <div class="scene" id="scene">
    <svg class="wires" viewBox="0 0 1280 720">
      <path id="p0" d="M360 360 L420 360" />
      <path id="pTop" d="M580 360 C632 360 628 195 680 195" />
      <path id="pBot" class="rustw" d="M580 360 C632 360 628 535 680 535" />
    </svg>

    <div class="abs win fade" id="xidl" style="left:30px;top:230px;width:330px;height:260px">
      <div class="bar"><span class="file"><i></i>user.idl</span><span class="tag">xidl</span></div>
      <div class="code" id="xidlCode"></div>
    </div>

    <div class="abs compiler fade" id="xidlc" style="left:420px;top:300px;width:160px;height:120px">
      <div class="ring"></div>
      <b>xidlc</b>
      <span id="cst">waiting for input</span>
    </div>

    <div class="abs win fade" id="webWin" style="left:680px;top:40px;width:560px;height:310px">
      <div class="bar"><span class="file"><i></i>web/src/handler.ts</span><span class="tag">Website</span></div>
      <div class="code" id="webCode"></div>
      <div class="prog" id="webProg"></div>
      <div class="foot"><span class="st" id="webSt">Writing…</span><span>TypeScript</span></div>
    </div>

    <div class="abs win fade" id="rsWin" style="left:680px;top:380px;width:560px;height:310px">
      <div class="bar"><span class="file"><i style="background:var(--rust)"></i>server/src/service.rs</span><span class="tag rust">Rust</span></div>
      <div class="code" id="rsCode"></div>
      <div class="prog rust" id="rsProg"></div>
      <div class="foot"><span class="st" id="rsSt">Writing…</span><span>Rust</span></div>
    </div>
  </div>

  <div class="abs win browser" id="browser">
    <div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url">localhost:3000/users/new</div><div style="width:46px"></div></div>
    <div class="page" id="page">
      <div>
        <h2>New User</h2>
        <p class="sub">Business code imports the generated code and implements the user.xidl interface</p>
      </div>
      <div class="field">name<div class="input">Ferris</div></div>
      <div class="btnwrap">
        <button class="btn" id="btn" type="button" tabindex="-1"><span class="label">Create User</span><svg viewBox="0 0 30 30" aria-hidden="true"><path d="M7 15.5 L12.5 21 L23 9.5" /></svg></button>
      </div>
      <div class="resp" id="resp"><span class="okc">200 OK</span><span>{ id: 1, name: "Ferris" }</span></div>
      <div class="cursor" id="cursor"><svg viewBox="0 0 22 22" aria-hidden="true"><path d="M3 2 L3 18 L7.5 14 L10.5 20.5 L13.2 19.3 L10.3 12.9 L16.5 12.9 Z" /></svg></div>
    </div>
  </div>

  <div class="caption"><b id="capN">1/4</b><span id="capT">Write the xidl interface definition</span></div>
</template>

<script>
const XIDL = [
  'module shop {',
  '  struct User {',
  '    uint64 id,',
  '    string name,',
  '  }',
  '',
  '  interface UserService {',
  '    User create_user(name: string);',
  '  }',
  '}',
];
const WEB = [
  'import { createUser, type User } from "generated";',
  '',
  'export async function handleCreateUser(',
  '  name: string,',
  '): Promise<User> {',
  '  return await createUser(name);',
  '}',
];
const RS = [
  'use generated::user::{self, User};',
  '',
  'struct Service;',
  '',
  'impl user::UserService for Service {',
  '    async fn create_user(&self, name: String)',
  '        -> Result<User> {',
  '        Ok(User { id: 1, name })',
  '    }',
  '}',
];
const KW = {
  xidl: 'module|struct|interface',
  ts: 'import|from|type|export|async|function|await|return|as',
  rs: 'use|struct|impl|for|async|fn|self|Ok',
};
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function hl(s, lang) {
  const re = new RegExp(`(\\/\\/.*$)|("[^"]*"?)|(#\\[[^\\]]*\\]?)|\\b(${KW[lang]})\\b|\\b([A-Z][A-Za-z0-9_]*|u64|string|number)\\b`, 'g');
  let out = '', last = 0, m;
  while ((m = re.exec(s))) {
    out += esc(s.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'a' : m[4] ? 'k' : 't';
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(s.slice(last));
}

const wrap = document.getElementById('wrap');
const stage = document.getElementById('stage');
new ResizeObserver(() => { stage.style.transform = `scale(${wrap.clientWidth / 1280})`; }).observe(wrap);

let token = 0;
const CHECK = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 7.5 L6 10.5 L11 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function runner(my) {
  const $ = id => stage.querySelector('#' + id);
  const wait = ms => new Promise((res, rej) => setTimeout(() => (my === token ? res() : rej('stale')), ms));
  const caption = (n, t) => { $('capN').textContent = n + '/4'; $('capT').textContent = t; };

  async function type(el, lines, lang, cps, prog, rust) {
    const total = lines.join('').replace(/ /g, '').length || 1;
    let done = 0;
    const caret = document.createElement('span');
    caret.className = 'caret' + (rust ? ' rust' : '');
    for (let i = 0; i < lines.length; i++) {
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="ln">${i + 1}</span><span></span>`;
      el.appendChild(row);
      const code = row.lastChild;
      row.appendChild(caret);
      const line = lines[i];
      for (let j = 1; j <= line.length; j++) {
        code.innerHTML = hl(line.slice(0, j), lang);
        if (line[j - 1] !== ' ') {
          done++;
          if (prog) prog.style.width = (done / total * 100) + '%';
          await wait((1000 / cps) * (0.5 + Math.random()));
        }
      }
      await wait(line.length ? 70 : 40);
    }
    caret.remove();
  }

  function draw(path, ms) {
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect();
    path.style.transition = `stroke-dashoffset ${ms}ms ease-in-out`;
    path.style.strokeDashoffset = 0;
  }

  function packet(path, ms, rust) {
    const svg = path.ownerSVGElement;
    const len = path.getTotalLength();
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('r', 5);
    if (rust) c.setAttribute('class', 'rustw');
    svg.appendChild(c);
    const t0 = performance.now();
    return new Promise(res => {
      (function step(now) {
        if (my !== token) return;
        const k = Math.min(1, (now - t0) / ms);
        const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        const p = path.getPointAtLength(e * len);
        c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
        if (k < 1) requestAnimationFrame(step); else { c.remove(); res(); }
      })(t0);
    });
  }

  function finish(stId, n) {
    const st = $(stId);
    st.classList.add('done');
    st.innerHTML = CHECK + `Implemented · ${n} lines`;
  }

  return async function run() {
    stage.innerHTML = document.getElementById('tpl').innerHTML;
    stage.querySelectorAll('svg.wires path').forEach(p => { const l = p.getTotalLength(); p.style.strokeDasharray = l; p.style.strokeDashoffset = l; });

    await wait(300);
    caption(1, 'Write the xidl interface definition');
    $('xidl').classList.add('on');
    $('xidlc').classList.add('on');
    await wait(400);
    await type($('xidlCode'), XIDL, 'xidl', 55);
    await wait(400);

    caption(2, 'Compile it with xidlc');
    draw($('p0'), 500);
    $('cst').textContent = 'reading user.xidl';
    await packet($('p0'), 600);
    $('xidlc').classList.add('busy');
    $('cst').textContent = 'parsing…';
    await wait(900);
    $('cst').textContent = 'generating targets';

    caption(3, 'Import generated code, write business logic');
    draw($('pTop'), 700);
    draw($('pBot'), 700);
    packet($('pTop'), 800);
    await packet($('pBot'), 800, true);
    $('webWin').classList.add('on');
    $('rsWin').classList.add('on');
    await wait(300);

    await Promise.all([
      type($('webCode'), WEB, 'ts', 42, $('webProg')).then(() => finish('webSt', WEB.length)),
      type($('rsCode'), RS, 'rs', 38, $('rsProg'), true).then(() => finish('rsSt', RS.length)),
    ]);
    $('xidlc').classList.remove('busy');
    $('xidlc').classList.add('ok');
    $('cst').textContent = 'all done';
    await wait(1000);

    caption(4, 'Run the website, call the Rust service');
    $('scene').classList.add('out');
    $('browser').classList.add('on');
    await wait(900);

    const page = $('page'), btn = $('btn'), cur = $('cursor');
    cur.style.transition = 'none';
    cur.style.transform = 'translate(620px, 420px)';
    cur.getBoundingClientRect();
    cur.style.transition = '';
    cur.style.opacity = 1;
    await wait(350);
    const pr = page.getBoundingClientRect(), br = btn.getBoundingClientRect();
    const scale = pr.width / page.offsetWidth;
    const tx = (br.left - pr.left + br.width * 0.56) / scale;
    const ty = (br.top - pr.top + br.height * 0.55) / scale;
    cur.style.transform = `translate(${tx}px, ${ty}px)`;
    await wait(1150);

    cur.classList.add('press'); btn.classList.add('press');
    await wait(140);
    cur.classList.remove('press'); btn.classList.remove('press');
    btn.classList.add('loading');
    cur.style.transform = `translate(${tx + 70}px, ${ty + 60}px)`;
    await wait(1000);
    btn.classList.add('done');
    await wait(500);
    $('resp').classList.add('on');
    cur.style.opacity = 0;

    await wait(3500);
    start();
  };
}

function start() {
  const my = ++token;
  runner(my)().catch(e => { if (e !== 'stale') console.error(e); });
}
document.getElementById('replay').addEventListener('click', start);
start();
</script>
</body>
</html>
