name: publish-release

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v0.98.0; empty uses the dispatched ref and rebuilds everything"
        required: false
        type: string

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (github.ref_type == 'tag' && github.ref_name || 'nightly') }}
  RUST_BACKTRACE: 1
  RUSTUP_MAX_RETRIES: 10

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  ensure-managed-release:
    name: Ensure Managed Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source ref
        uses: actions/checkout@v7

      - name: Generate release body
        if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
        run: |
          mkdir -p release
          sed \
            -e "s|REPOSITORY|${GITHUB_REPOSITORY}|g" \
            -e "s|RELEASE_TAG|${RELEASE_TAG}|g" \
            ./.github/release_template.md > release/body.md

      - name: Create or update managed release
        if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            release_flags=(--latest)
          else
            release_flags=(--prerelease --latest=false)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release/body.md \
              "${release_flags[@]}"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release/body.md \
              "${release_flags[@]}"
          fi

      - name: Verify the requested release exists
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

  upload-assets:
    needs:
      - ensure-managed-release
    name: ${{ matrix.target }}
    # A dispatched tag keeps the assets its release already carries.
    if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-15-intel
            use_cross: false
            setup_cross_toolchain: false
          - target: aarch64-apple-darwin
            os: macos-14
            use_cross: false
            setup_cross_toolchain: false
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            use_cross: false
            setup_cross_toolchain: false
          - target: aarch64-pc-windows-msvc
            os: windows-2022
            use_cross: false
            setup_cross_toolchain: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            setup_cross_toolchain: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
            setup_cross_toolchain: false
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup CLI build toolchain
        uses: ./.github/actions/setup-cli-build
        with:
          target: ${{ matrix.target }}
          use_cross: ${{ matrix.use_cross }}
          setup_cross_toolchain: ${{ matrix.setup_cross_toolchain }}

      - uses: taiki-e/upload-rust-binary-action@v1.30.2
        with:
          package: xidlc
          bin: xidlc
          profile: release
          target: ${{ matrix.target }}
          tar: all
          zip: windows
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_type == 'tag' && github.ref || 'refs/tags/nightly' }}
          features: fmt,cli

  publish-npm:
    name: Publish npm packages
    needs:
      - ensure-managed-release
      - upload-assets
    if: |
      !cancelled() &&
      (github.ref_type == 'tag' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != '')) &&
      needs.ensure-managed-release.result == 'success' &&
      (needs.upload-assets.result == 'success' || needs.upload-assets.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: latest

      - name: Download release binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node packages/scripts/fetch-binaries.mjs \
            --ref "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}"

      - name: Publish packages
        run: |
          node packages/scripts/publish.mjs --registry=https://registry.npmjs.org/
