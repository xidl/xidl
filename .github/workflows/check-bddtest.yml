name: check-bddtest

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  bddtest-shard:
    name: bddtest (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: jsonrpc-and-rest-core
            port-base: 12000
          - shard: rest-media-and-any
            port-base: 13000
          - shard: rest-boilerplate-a
            port-base: 14000
          - shard: rest-boilerplate-b
            port-base: 15000
          - shard: rest-boilerplate-c
            port-base: 16000
          - shard: rest-errors
            port-base: 17000
          - shard: rest-serialization
            port-base: 18000
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.11.0

      - uses: jdx/mise-action@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2.87.25
        with:
          tool: just

      - name: BDD test
        env:
          XIDL_BDD_PORT_BASE: ${{ matrix.port-base }}
        run: |
          BDD_FEATURES="bdd/features --tags=@bdd_${{ matrix.shard }}" just test-bdd

  bddtest:
    name: bddtest
    runs-on: ubuntu-latest
    needs: bddtest-shard
    if: ${{ always() }}
    steps:
      - name: BDD shards passed
        run: |
          test "${{ needs.bddtest-shard.result }}" = "success"
