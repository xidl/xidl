name: check-unittest

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  cargo-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup HTTP documentation frontend
        uses: ./.github/actions/setup-http-docs-frontend

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: rustfmt

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: golang/xidl-go/go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: |
          python3 -m pip install pre-commit

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: cross

      - name: Install taplo
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: taplo-cli

      - name: Install just
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: just

      - name: Pre-commit
        run: |
          pre-commit run -a

      - name: Cargo test
        run: |
          just test-rust

      - name: Go test
        run: |
          just test-go

      - name: TypeScript runtime tests
        run: |
          just test-typescript

      - name: npm package tests
        run: |
          just test-npm

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          components: clippy

      - name: Cargo clippy
        run: |
          cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Install cargo-tarpaulin
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-tarpaulin

      - name: Install just
        uses: taiki-e/install-action@v2.88.1
        with:
          tool: just

      - name: xidl-parser coverage
        run: |
          just test-coverage

  try-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0

      - name: Check release
        run: |
          cargo publish --workspace --dry-run

  check-wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
          targets: wasm32-unknown-unknown

      - name: Check wasm compilation
        run: |
          cargo check -p xidl-rust-axum --target wasm32-unknown-unknown --no-default-features --features client
          cargo check -p xidl-rust-axum --target wasm32-unknown-unknown --no-default-features --features router
          bash scripts/check-router-wasm.sh
