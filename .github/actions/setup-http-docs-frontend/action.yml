name: Setup HTTP documentation frontend
description: Install the host tools used to build generated Starlight documentation.
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6.1.0
      with:
        version: 11.11.0
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24
