[package]
name = "xidlc"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
exclude = ["**/*.snap"]

[[bin]]
name = "xidlc"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = [
  "gen-rust",
  "gen-rust-jsonrpc",
  "gen-rust-axum",
  "gen-rust-axum-adapters",
  "gen-typescript",
  "gen-typescript-rest",
  "gen-typescript-rest-adapters",
  "gen-go",
  "gen-go-rest",
  "gen-openapi",
  "gen-openrpc",
]
gen-rust = []
gen-rust-jsonrpc = ["gen-rust"]
gen-rust-axum = ["gen-rust", "dep:percent-encoding"]
gen-rust-axum-adapters = ["gen-rust"]
gen-typescript = []
gen-typescript-rest = ["gen-typescript"]
gen-typescript-rest-adapters = ["gen-typescript"]
gen-go = []
gen-go-rest = ["gen-go"]
gen-openapi = []
gen-openrpc = []
cli = [
  "dep:clap",
  "dep:tracing",
  "dep:tracing-subscriber",
  "dep:tree-sitter-highlight",
  "dep:owo-colors",
  "dep:miette",
  "miette/fancy",
]

[lints]
workspace = true

[dependencies]
xidl-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
miette = { version = "7.6.0", optional = true }
minijinja = { workspace = true, features = ["loader", "json"] }
convert_case.workspace = true
glob.workspace = true
clap = { workspace = true, features = ["derive"], optional = true }
include_dir = "0.7"
scopeguard = "1.2.0"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }
itertools = "0.15.0"
tree-sitter.workspace = true
tree-sitter-highlight = { version = "=0.25.0", optional = true }
owo-colors = { version = "4.2", optional = true }
tree-sitter-idl.workspace = true
prettyplease = "0.3.0"
syn = "3.0"
percent-encoding = { version = "2.3", optional = true }
indexmap = { version = "2", features = ["serde"] }

semver = "1.0"
jiff = "0.2"

[[test]]
name = "codegen_snapshot"
path = "tests/codegen_snapshot.rs"

[[test]]
name = "http_validation"
path = "tests/http_validation.rs"

[[test]]
name = "versioned_libraries"
path = "tests/versioned_libraries/mod.rs"

[dev-dependencies]
insta = { workspace = true, features = ["json", "redactions"] }
tempfile.workspace = true
